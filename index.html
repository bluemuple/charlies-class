<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wharenui Maths — Charlie's Class</title>
<meta name="description" content="Wharenui School maths games for Charlie's class: Al-Zebra and the Algebra Machine — multiplayer algebra games where students write rules, crack codes and earn Whare.">
<link rel="canonical" href="https://bluemuple.github.io/charlies-class/">
<meta property="og:title" content="Wharenui Maths — Charlie's Class">
<meta property="og:description" content="Maths games for Wharenui School: write algebra rules, crack your classmates' codes, earn Whare.">
<meta property="og:url" content="https://bluemuple.github.io/charlies-class/">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebSite",
 "name":"Wharenui Maths — Charlie's Class",
 "alternateName":["Wharenui Maths","Charlie's Class"],
 "url":"https://bluemuple.github.io/charlies-class/",
 "description":"Maths games for a Year 6/7 class at Wharenui School, Christchurch, New Zealand."}
</script>
<style>
  :root{
    --teal:#2e7d74; --teal-dark:#1f5a54; --yellow:#ffee32; --cream:#fdf6e3;
    --ink:#22333b; --card:#ffffff; --accent:#e63946; --good:#2a9d34;
    --boy:#3a6ea5; --girl:#c2547d;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{
    font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,#eef7f5 0%,#dcefe9 45%,#cfe8df 100%);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
  }
  button{font-family:inherit; cursor:pointer;}
  .screen{display:none; width:min(94vw,900px); padding:4vh 10px 60px; text-align:center;}
  .screen.on{display:block;}
  h1{font-size:clamp(28px,5vw,46px); color:var(--teal-dark); margin:6vh 0 1vh;}
  .sub{font-size:clamp(15px,2.2vw,19px); color:#4c6b66; margin-bottom:5vh;}

  .back{
    position:fixed; left:14px; top:14px; z-index:10;
    border:2px solid #cfe3df; background:#fff; color:var(--teal-dark);
    border-radius:12px; padding:8px 16px; font-size:15px; font-weight:700;
  }
  .back:hover{background:#eef7f5;}

  /* gender choice */
  .gender-btns{display:flex; gap:24px; justify-content:center; flex-wrap:wrap;}
  .gender-btns button{
    width:min(38vw,260px); aspect-ratio:1.15; border:0; border-radius:22px;
    font-size:clamp(20px,3vw,28px); font-weight:800; color:#fff;
    box-shadow:0 6px 18px rgba(31,90,84,.25); transition:transform .15s;
  }
  .gender-btns button span{display:block; font-size:clamp(44px,8vw,76px); margin-bottom:8px;}
  .gender-btns button:hover{transform:translateY(-4px) scale(1.03);}
  #boysBtn{background:linear-gradient(160deg,#4a82bd,#2f5d8f);}
  #girlsBtn{background:linear-gradient(160deg,#d06a92,#a93f68);}

  /* name grid */
  .names{display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:14px;}
  .names button{
    position:relative;
    border:0; border-radius:16px; background:var(--card); padding:20px 10px;
    font-size:clamp(17px,2.2vw,22px); font-weight:700; color:var(--ink);
    box-shadow:0 3px 10px rgba(31,90,84,.15); transition:.15s;
  }
  .names button:hover{transform:translateY(-3px); box-shadow:0 8px 18px rgba(31,90,84,.28); background:var(--cream);}
  .names button .em{display:block; font-size:32px; margin-bottom:6px;}
  .names button .newtag{
    position:absolute; top:8px; right:8px;
    background:var(--yellow); color:#6b5c00; font-size:10.5px; font-weight:800;
    border-radius:20px; padding:2px 9px; letter-spacing:.4px;
  }

  /* code screen */
  #pinHello{font-size:clamp(24px,4vw,36px); color:var(--teal-dark); margin:5vh 0 8px;}
  #pinMsg{min-height:24px; font-size:16px; font-weight:600; color:#4c6b66; margin-bottom:6px;}
  #pinNote{min-height:20px; font-size:13.5px; color:#8aa19c; margin-bottom:12px;}
  .dots{display:flex; gap:16px; justify-content:center; margin-bottom:26px;}
  .dots i{
    width:22px; height:22px; border-radius:50%; border:3px solid var(--teal);
    background:#fff; transition:.12s;
  }
  .dots i.full{background:var(--teal);}
  .dots.make i{border-color:#b58900;}
  .dots.make i.full{background:#e0a800;}
  .dots.err i{border-color:var(--accent); animation:wob .4s;}
  @keyframes wob{
    0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)}
    50%{transform:translateX(7px)} 75%{transform:translateX(-4px)}
  }
  .pad{display:grid; grid-template-columns:repeat(3,88px); gap:12px; justify-content:center;}
  .pad button{
    height:72px; border:0; border-radius:16px; background:var(--card);
    font-size:28px; font-weight:800; color:var(--ink);
    box-shadow:0 3px 8px rgba(31,90,84,.18); transition:.12s;
  }
  .pad button:hover{background:var(--cream); transform:scale(1.06);}
  .pad button.fn{font-size:20px; color:#7a8f8b;}

  /* emoji picker screen */
  #scrEmoji h1{margin-top:3vh;}
  #pickerBox{max-width:640px; margin:0 auto;}

  #brand{
    position:fixed; left:14px; bottom:10px; z-index:5;
    font-size:12.5px; font-weight:700; letter-spacing:.4px; color:#4c6b66;
    background:#ffffffcc; padding:4px 13px; border-radius:14px;
    box-shadow:0 1px 4px rgba(0,0,0,.08); pointer-events:none;
  }
</style>
</head>
<body>

<!-- 1 · welcome -->
<section class="screen on" id="scrWelcome">
  <h1>🏫 Welcome to Charlie's Class</h1>
  <p class="sub">Tap your group to find your name.</p>
  <div class="gender-btns">
    <button id="boysBtn"><span>👦</span>Boys</button>
    <button id="girlsBtn"><span>👧</span>Girls</button>
  </div>
</section>

<!-- 2 · pick your name -->
<section class="screen" id="scrNames">
  <button class="back" data-back="scrWelcome">← Back</button>
  <h1 id="namesTitle">Find your name</h1>
  <p class="sub">Tap your name card.</p>
  <div class="names" id="nameGrid"></div>
</section>

<!-- 3 · secret code (make one, or type yours) -->
<section class="screen" id="scrPin">
  <button class="back" data-back="scrNames">← Back</button>
  <h1 id="pinHello">Hi!</h1>
  <p id="pinMsg">Type your 4-digit secret code.</p>
  <p id="pinNote"></p>
  <div class="dots" id="pinDots"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pinPad">
    <button>1</button><button>2</button><button>3</button>
    <button>4</button><button>5</button><button>6</button>
    <button>7</button><button>8</button><button>9</button>
    <button class="fn" data-k="clear">C</button><button>0</button><button class="fn" data-k="back">⌫</button>
  </div>
</section>

<!-- 4 · first login: pick your emoji -->
<section class="screen" id="scrEmoji">
  <h1 id="emojiTitle">Pick your emoji!</h1>
  <p class="sub">This is you in Charlie's Class. Choose wisely… you can change it later. 😄</p>
  <div id="pickerBox"></div>
</section>

<div id="brand">Wharenui School</div>

<script src="js/config.js"></script>
<script src="js/roster.js"></script>
<script src="js/store.js"></script>
<script src="js/emoji.js"></script>
<script>
(function(){
  "use strict";
  var store = window.CharlieStore;
  function $(id){ return document.getElementById(id); }

  var students = [];
  var picked = null;     // student logging in
  var step = 'login';    // 'login' | 'make' | 'again'
  var pin = '';
  var firstTry = '';     // the code typed on the "make" step

  function show(id){
    Array.prototype.forEach.call(document.querySelectorAll('.screen'), function(s){
      s.classList.toggle('on', s.id === id);
    });
  }
  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function saveSession(s){
    try{
      sessionStorage.setItem('charlie-session', JSON.stringify({id:s.id, name:s.name, emoji:s.emoji}));
    }catch(e){}
  }
  function goHub(){ window.location.href = 'hub.html'; }

  /* ---------------- gender → names ---------------- */
  var namesGender = null;   /* so a late roster can repaint the open list */
  function openNames(gender){
    namesGender = gender;
    var kids = students.filter(function(s){ return s.gender === gender; });
    $('namesTitle').textContent = gender === 'boy' ? '👦 Boys' : '👧 Girls';
    $('nameGrid').innerHTML = kids.length ? kids.map(function(s){
      return '<button data-id="' + esc(s.id) + '">'
        + (s.codeSet ? '' : '<span class="newtag">NEW</span>')
        + '<span class="em">' + esc(s.emoji || '🙂') + '</span>' + esc(s.name) + '</button>';
    }).join('')
      : '<div style="grid-column:1/-1;text-align:center;color:#8aa19c;font-weight:600;padding:18px 0">'
        + 'Fetching the class list…</div>';
    show('scrNames');
  }
  /* the roster can arrive after the first tap — repaint the open list */
  function namesArrived(){
    var on = document.querySelector('.screen.on');
    if(on && on.id === 'scrNames' && namesGender) openNames(namesGender);
  }
  $('boysBtn').addEventListener('click', function(){ openNames('boy'); });
  $('girlsBtn').addEventListener('click', function(){ openNames('girl'); });

  /* ---------------- name → code screen ---------------- */
  function renderStep(){
    var msg = $('pinMsg'), note = $('pinNote');
    if(step === 'login'){
      msg.textContent = 'Type your 4-digit secret code.';
      note.textContent = 'Forgotten it? Ask your teacher to reset it.';
    } else if(step === 'make'){
      msg.textContent = 'Make up a 4-digit secret code.';
      note.textContent = 'Pick something you will remember — and keep it to yourself!';
    } else {
      msg.textContent = 'Type the same code again.';
      note.textContent = 'Just to be sure you remember it. 🙂';
    }
    $('pinDots').classList.toggle('make', step !== 'login');
    renderDots();
  }
  $('nameGrid').addEventListener('click', function(e){
    var b = e.target.closest('button[data-id]'); if(!b) return;
    picked = students.filter(function(s){ return s.id === b.dataset.id; })[0];
    if(!picked) return;
    pin = ''; firstTry = '';
    step = picked.codeSet ? 'login' : 'make';
    $('pinHello').textContent = 'Hi ' + picked.name + '! 👋';
    renderStep();
    show('scrPin');
  });

  /* ---------------- keypad ---------------- */
  function renderDots(){
    var dots = $('pinDots').children;
    for(var i = 0; i < 4; i++) dots[i].classList.toggle('full', i < pin.length);
  }
  function shake(message){
    var d = $('pinDots');
    d.classList.add('err');
    $('pinMsg').textContent = message;
    setTimeout(function(){ d.classList.remove('err'); pin = ''; renderDots(); }, 500);
  }
  function afterFour(){
    if(step === 'make'){
      firstTry = pin; pin = ''; step = 'again'; renderStep();
      return;
    }
    if(step === 'again'){
      if(pin !== firstTry){
        firstTry = ''; step = 'make';
        $('pinDots').classList.add('make');
        shake('Those two didn\'t match — let\'s try again!');
        setTimeout(renderStep, 520);
        return;
      }
      store.setCode(picked.id, pin).then(function(s){
        if(!s){                       // someone set it first, or it was refused
          step = 'login'; firstTry = '';
          shake('This name already has a code — type it in.');
          setTimeout(renderStep, 520);
          return;
        }
        enter(s, true);
      });
      return;
    }
    store.verifyLogin(picked.id, pin).then(function(s){
      if(!s){ shake('Hmm, that\'s not it — try again!'); return; }
      enter(s, false);
    });
  }
  function enter(s, isNew){
    saveSession(s);
    if(s.emoji){ goHub(); return; }
    $('emojiTitle').textContent = 'Pick your emoji, ' + s.name + '!';
    window.CharlieEmoji.mount($('pickerBox'), {
      onSave: function(emoji){
        store.update(s.id, {emoji:emoji}).then(function(){
          s.emoji = emoji;
          saveSession(s);
          goHub();
        });
      }
    });
    show('scrEmoji');
  }
  function pressKey(k){
    if(k === 'clear'){ pin = ''; }
    else if(k === 'back'){ pin = pin.slice(0, -1); }
    else if(/^[0-9]$/.test(k) && pin.length < 4){ pin += k; }
    renderDots();
    if(pin.length === 4) setTimeout(afterFour, 120);
  }
  $('pinPad').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    pressKey(b.dataset.k || b.textContent.trim());
  });
  document.addEventListener('keydown', function(e){
    if(!$('scrPin').classList.contains('on')) return;
    if(/^[0-9]$/.test(e.key)) pressKey(e.key);
    else if(e.key === 'Backspace') pressKey('back');
  });

  /* ---------------- back buttons ---------------- */
  document.addEventListener('click', function(e){
    var b = e.target.closest('.back'); if(!b) return;
    show(b.dataset.back);
  });

  /* ---------------- init ---------------- */
  store.init().then(function(){
    store.onChange(function(){
      store.list().then(function(l){ students = l; namesArrived(); });
    });
    return store.list();
  }).then(function(list){
    students = list;
    namesArrived();
  });
})();
</script>
</body>
</html>
