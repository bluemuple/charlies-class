<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Charlie's Class — Games</title>
<style>
  :root{
    --teal:#2e7d74; --teal-dark:#1f5a54; --yellow:#ffee32; --cream:#fdf6e3;
    --ink:#22333b; --card:#ffffff; --accent:#e63946; --good:#2a9d34;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{
    font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,#eef7f5 0%,#dcefe9 45%,#cfe8df 100%);
    min-height:100vh;
  }
  button{font-family:inherit; cursor:pointer;}

  header{
    display:flex; align-items:center; gap:14px;
    padding:14px 22px;
  }
  header h1{font-size:clamp(19px,2.6vw,26px); color:var(--teal-dark);}
  #meBtn{
    margin-left:auto; display:flex; align-items:center; gap:10px;
    border:2px solid #cfe3df; background:#fff; border-radius:30px;
    padding:7px 16px 7px 10px; font-size:16px; font-weight:800; color:var(--teal-dark);
    box-shadow:0 2px 8px rgba(31,90,84,.15); transition:.15s;
  }
  #meBtn:hover{transform:scale(1.05); background:var(--cream);}
  #meBtn .em{font-size:24px;}

  main{max-width:980px; margin:0 auto; padding:2vh 22px 70px;}
  main h2{font-size:clamp(22px,3.4vw,32px); color:var(--teal-dark); margin:3vh 0 2vh; text-align:center;}
  .games{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px;}
  .game{
    border:0; border-radius:20px; background:var(--card); padding:26px 18px;
    box-shadow:0 4px 14px rgba(31,90,84,.16); text-align:center; transition:.15s;
  }
  .game:hover{transform:translateY(-4px); box-shadow:0 10px 22px rgba(31,90,84,.26);}
  .game .art{font-size:56px; display:block; margin-bottom:10px;}
  .game .t{font-size:20px; font-weight:800; color:var(--teal-dark);}
  .game .d{font-size:14px; color:#6b8480; margin-top:6px; line-height:1.4;}
  .game.soon{opacity:.75;}
  .game .badge{
    display:inline-block; margin-top:10px; font-size:12px; font-weight:800;
    background:var(--yellow); color:#6b5c00; border-radius:20px; padding:3px 12px;
  }

  /* profile: big centred popup, scrolls vertically */
  #profWrap{
    position:fixed; inset:0; z-index:40; display:none;
    background:rgba(10,30,28,.6); align-items:center; justify-content:center;
    padding:3vh 14px;
  }
  #profWrap.open{display:flex;}
  #prof{
    background:#fff; width:min(94vw,720px); max-height:94vh;
    padding:26px 30px; border-radius:24px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
    overflow-y:auto; overscroll-behavior:contain;
  }
  @media (max-width:640px){
    #profWrap{padding:0;}
    #prof{
      width:100vw; border-radius:0;
      height:100vh; max-height:100vh;
      height:100dvh; max-height:100dvh;   /* tracks the real visible area on phones */
    }
  }
  #profClose{
    border:0; background:#eef1f0; color:#5c7671; border-radius:10px;
    padding:7px 14px; font-size:14px; font-weight:700;
  }
  .prof-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .prof-me{text-align:center; margin:10px 0 18px;}
  .prof-me .em{font-size:74px; line-height:1.1;}
  .prof-me .nm{font-size:24px; font-weight:800; color:var(--teal-dark); margin-top:4px;}
  .prof-money{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:#e3f4f0; border-radius:14px; padding:12px; margin-bottom:16px;
    font-size:20px; font-weight:800; color:var(--teal-dark);
  }
  .prof-sec{margin-bottom:16px;}
  .prof-sec h3{font-size:12.5px; text-transform:uppercase; letter-spacing:1px; color:#7a8f8b; margin-bottom:8px;}
  .prof-empty{
    background:#f6fbfa; border:1.5px dashed #cfe3df; border-radius:12px;
    padding:16px 12px; font-size:14px; color:#8aa19c; text-align:center; line-height:1.5;
  }

  /* items won in games (sprites from the two product sheets) */
  .sprite{
    background-image:url(assets/snacks.jpg);
    background-size:500% 400%; background-repeat:no-repeat;
    border-radius:8px; aspect-ratio:1/1;
  }
  .sprite.n{background-image:url(assets/non-snacks.jpg);}
  .stuff-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .stuff-grid button{
    border:2px solid #e2edeb; border-radius:12px; background:#fbfdfc; padding:6px;
    transition:.12s; position:relative;
  }
  .stuff-grid button:hover{transform:scale(1.06); border-color:var(--teal);}
  .stuff-grid .nm{font-size:10px; font-weight:700; color:#5c7671; display:block; margin-top:3px;}
  .stuff-grid .tag{
    position:absolute; top:4px; right:4px; background:var(--yellow); color:#6b5c00;
    font-size:9.5px; font-weight:800; border-radius:10px; padding:1px 6px;
  }

  /* rule attempts history */
  .att{
    border:1.5px solid #e2edeb; border-radius:12px; padding:8px 10px; margin-bottom:7px;
    font-size:13.5px; background:#fbfdfc;
  }
  .att .try{color:#4c6b66; font-weight:600;}
  .att .rule{font-weight:800; color:var(--teal-dark);}
  .att.win{border-color:#f0d36b; background:#fffdf2;}
  .att.win .rule{color:#8a6d00; animation:sparkle 1s ease-in-out 3;}
  @keyframes sparkle{
    0%,100%{text-shadow:0 0 2px rgba(255,214,64,.3); filter:brightness(1);}
    50%{text-shadow:0 0 12px rgba(255,196,0,1), 0 0 26px rgba(255,230,120,.8); filter:brightness(1.45);}
  }

  /* ---------- the pet ---------- */
  .pet-card{text-align:center;}
  .pet-love{font-size:18px; font-weight:800; color:var(--accent); margin-bottom:2px;}
  .pet-name{font-size:16px; font-weight:800; color:var(--teal-dark); margin-bottom:6px;}
  .pet-name button{border:0; background:none; font-size:15px; opacity:.6; padding:2px 4px;}
  .pet-name button:hover{opacity:1; transform:scale(1.15);}
  .pet-stage{position:relative; width:min(62vw,230px); margin:0 auto;}
  .pet-stage img{width:100%; border-radius:16px; display:block; box-shadow:0 4px 14px rgba(31,90,84,.18);}
  .pet-stage img.happy{
    position:absolute; inset:0; opacity:0; transition:opacity 1.2s ease;
  }
  .pet-stage.fed img.happy{opacity:1;}
  .pet-hint{font-size:12.5px; color:#8aa19c; margin-top:6px;}
  .pet-powers{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:8px;}
  .pet-powers span{
    background:#f4f0fd; color:#5b3fa8; border:1.5px solid #d9cff2;
    border-radius:14px; padding:3px 10px; font-size:12px; font-weight:700;
  }
  .snack-fly{position:fixed; z-index:80; pointer-events:none; width:56px;}

  /* pet shop grid (silhouettes until they come home) */
  .pet-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px;}
  .pet-grid button{
    border:2px solid #e2edeb; border-radius:14px; background:#fbfdfc; padding:10px;
    transition:.12s; text-align:center;
  }
  .pet-grid button:hover{transform:translateY(-3px); border-color:var(--teal);}
  .pet-grid img{width:100%; border-radius:10px; display:block;}
  .pet-grid .pn{font-size:14px; font-weight:800; color:var(--teal-dark); margin-top:6px;}
  .pet-grid .pp{font-size:12.5px; font-weight:800; color:#8a6d00; background:var(--yellow);
               border-radius:12px; padding:2px 10px; display:inline-block; margin-top:4px;}

  /* superpower chooser */
  #powerWrap{
    position:fixed; inset:0; z-index:60; display:none;
    background:rgba(10,30,28,.65); align-items:center; justify-content:center; padding:16px;
  }
  #powerWrap.open{display:flex;}
  #powerBox{
    background:#fff; border-radius:20px; padding:22px 24px; width:min(94vw,460px);
    box-shadow:0 16px 50px rgba(0,0,0,.5); max-height:90vh; overflow-y:auto;
  }
  #powerTitle{font-size:19px; font-weight:800; color:var(--teal-dark); margin-bottom:4px;}
  #powerList button{
    display:block; width:100%; text-align:left; margin-top:8px;
    border:2px solid #d9cff2; background:#f9f7fe; border-radius:12px;
    padding:10px 12px; font-size:14px; font-weight:600; color:var(--ink); line-height:1.4;
  }
  #powerList button:hover{background:#f0eafd; border-color:#5b3fa8; transform:translateX(3px);}
  .prof-btn{
    width:100%; border:0; border-radius:12px; padding:11px 0; font-size:15px;
    font-weight:700; margin-top:8px; background:var(--teal); color:#fff;
  }
  .prof-btn:hover{background:var(--teal-dark);}
  .prof-btn.quiet{background:#eef1f0; color:#5c7671;}
  .prof-btn.quiet:hover{background:#e2e8e6;}
  #profPicker{margin-top:10px;}

  #toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-90px);
    z-index:60; background:#22333b; color:#fff; font-size:15px; font-weight:600;
    padding:10px 20px; border-radius:30px; box-shadow:0 6px 18px rgba(0,0,0,.3);
    transition:transform .3s ease; pointer-events:none; max-width:82vw; text-align:center;
  }
  #toast.show{transform:translateX(-50%) translateY(0);}

  #brand{
    position:fixed; left:14px; bottom:10px; z-index:5;
    font-size:12.5px; font-weight:700; letter-spacing:.4px; color:#4c6b66;
    background:#ffffffcc; padding:4px 13px; border-radius:14px;
    box-shadow:0 1px 4px rgba(0,0,0,.08); pointer-events:none;
  }
</style>
</head>
<body>

<div id="toast"></div>

<header>
  <h1>🏫 Charlie's Class</h1>
  <button id="meBtn"><span class="em" id="meEmoji">🙂</span><span id="meName">…</span></button>
</header>

<main>
  <h2>Choose a game</h2>
  <div class="games">
    <button class="game" id="alzebraGame">
      <span class="art">🦓</span>
      <span class="t">Al-Zebra</span>
      <span class="d">For beginners — feed the zebra the right outputs, fast! Race a friend over 6 carrots.</span>
      <span class="badge">▶ Play now</span>
    </button>
    <button class="game" id="algebraGame">
      <span class="art">🥤</span>
      <span class="t">Algebra Machine</span>
      <span class="d">For intermediates — sell snacks with a secret rule, or crack another seller's rule and win the lot!</span>
      <span class="badge">▶ Play now</span>
    </button>
    <button class="game soon" disabled>
      <span class="art">🎁</span>
      <span class="t">More games</span>
      <span class="d">New games will appear here during the year.</span>
    </button>
  </div>
</main>

<!-- profile drawer -->
<div id="profWrap">
  <div id="prof">
    <div class="prof-head">
      <h3 style="font-size:16px;color:var(--teal-dark)">My room</h3>
      <button id="profClose">✕ Close</button>
    </div>
    <div id="profMain">
      <div class="prof-me">
        <div class="em" id="profEmoji">🙂</div>
        <div class="nm" id="profName">…</div>
      </div>
      <div class="prof-money">💰 <span id="profMoney">0</span> Whare</div>
      <div class="prof-sec">
        <h3>My stuff</h3>
        <div id="stuffBox"></div>
      </div>
      <div class="prof-sec">
        <h3>🕵️ My rule attempts</h3>
        <div id="attemptsBox"></div>
      </div>
      <div class="prof-sec">
        <h3>My pet</h3>
        <div id="petBox"></div>
      </div>
      <button class="prof-btn" id="editEmojiBtn">🙂 Change my emoji</button>
      <button class="prof-btn quiet" id="logoutBtn">← Log out</button>
    </div>
    <div id="profPicker" style="display:none">
      <div id="profPickerBox"></div>
      <button class="prof-btn quiet" id="pickerBack">← Never mind</button>
    </div>
    <div id="profShop" style="display:none">
      <div class="prof-head" style="margin-bottom:6px">
        <h3 style="font-size:16px;color:var(--teal-dark)">🐾 Pet Shop</h3>
      </div>
      <p style="font-size:13.5px;color:#8aa19c;margin-bottom:10px">
        One pet per student — it lives in your room, eats your spare snacks,
        and learns a superpower every 10 ❤️.</p>
      <div class="pet-grid" id="petGrid"></div>
      <button class="prof-btn quiet" id="shopBack">← Never mind</button>
    </div>
  </div>
</div>

<!-- superpower chooser (every 10 affection) -->
<div id="powerWrap">
  <div id="powerBox">
    <div id="powerTitle"></div>
    <p style="font-size:13.5px;color:#8aa19c;margin-bottom:10px">Pick ONE — choose wisely!</p>
    <div id="powerList"></div>
  </div>
</div>

<div id="brand">Wharenui School</div>

<script src="js/config.js"></script>
<script src="js/roster.js"></script>
<script src="js/store.js"></script>
<script src="js/emoji.js"></script>
<script src="js/game-core.js"></script>
<script>
(function(){
  "use strict";
  var store = window.CharlieStore;
  function $(id){ return document.getElementById(id); }

  /* ---------------- session ---------------- */
  var sess = null;
  try{ sess = JSON.parse(sessionStorage.getItem('charlie-session')); }catch(e){}
  if(!sess && window.CHARLIE_TEST_SESSION) sess = window.CHARLIE_TEST_SESSION;
  if(!sess || !sess.id){ window.location.replace('index.html'); }

  var me = null;   // live student row

  var toastTimer = null;
  function toast(msg){
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
  }

  var G = window.GameCore;
  var machineState = {};   // machine id → state, to keep live rules secret

  function render(){
    if(!me) return;
    var em = me.emoji || '🙂';
    $('meEmoji').textContent = em;
    $('meName').textContent = me.name;
    $('profEmoji').textContent = em;
    $('profName').textContent = me.name;
    $('profMoney').textContent = me.money || 0;
    renderStuff();
    renderPet();
    renderAttempts();
  }

  /* ---------------- my stuff (game prizes) ---------------- */
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function spriteDiv(key){
    var p = G.PRODUCTS[key];
    if(!p) return '';
    return '<div class="sprite'+(p.sheet==='n'?' n':'')+'" style="background-position:'
      + (p.col*25) + '% ' + (p.row*100/3) + '%"></div>';
  }
  function renderStuff(){
    var items = me.items || [];
    if(!items.length){
      $('stuffBox').innerHTML = '<div class="prof-empty">Snacks and prizes you win in the games will show up here. 🍪🧸</div>';
      return;
    }
    $('stuffBox').innerHTML = '<div class="stuff-grid">' + items.map(function(k, i){
      var p = G.PRODUCTS[k];
      if(!p) return '';
      var tag = p.sell ? '<span class="tag">'+p.sell+' W</span>' : '';
      return '<button data-i="'+i+'" title="'+esc(p.name)+'">'+tag+spriteDiv(k)
        + '<span class="nm">'+esc(p.name)+'</span></button>';
    }).join('') + '</div>';
  }
  /* ONE latch for every write that touches me.items (sell OR feed) — two
     quick clicks must never both compute from the same stale copy */
  var stuffBusy = false;
  $('stuffBox').addEventListener('click', function(e){
    var b = e.target.closest('button[data-i]'); if(!b || stuffBusy) return;
    var i = parseInt(b.dataset.i, 10);
    var k = (me.items||[])[i];
    var p = k && G.PRODUCTS[k];
    if(!p) return;
    if(!p.sell){
      if(!me.pet){
        toast('🐾 ' + p.name + ' is pet food — buy a pet in the Pet Shop below!');
        return;
      }
      if(!window.confirm('Give the ' + p.name + ' to ' + petCallName(me.pet) + '? 😋')) return;
      feedPet(i, k, b);
      return;
    }
    if(!window.confirm('Sell your ' + p.name + ' for ' + p.sell + ' Whare?')) return;
    stuffBusy = true;
    var items = me.items.slice();
    items.splice(i, 1);
    store.update(me.id, {items:items, money:(me.money||0) + p.sell}).then(function(){
      toast('💰 Sold! +' + p.sell + ' Whare');
      return refresh();
    }).then(function(){ stuffBusy = false; })
      .catch(function(){ stuffBusy = false; toast('Hmm, that didn\'t save — try again!'); });
  });

  /* ---------------- the pet: shop, naming, feeding, superpowers ----------
     One pet per student. Feeding a snack = +5 affection; every 10 affection
     the student picks one superpower from the animal's list. */
  var PETS = {
    1:{name:'Goldfish', price:10, powers:[
      '🫧 Bubble of Calm — one deep breath fixes a wobbly moment',
      '📚 Goldfish Memory — never forgets homework due dates',
      '💧 Deep-Water Focus — 10 quiet minutes of pure concentration',
      '✨ Shiny Scales — a confidence sparkle before you speak up',
      '🌊 Cool Current — washes arguments away before they grow']},
    2:{name:'Axolotl', price:12, powers:[
      '🩹 Regrow — bounce back fast from any mistake',
      '😊 Forever Smile — instant cheer-up on grey days',
      '🔬 Lab Partner — makes science homework feel easy',
      '🌙 Soft Glow — a gentle nightlight for good sleep',
      '🧘 Chill Champion — teaches world-class calm']},
    3:{name:'Cat', price:14, powers:[
      '🧶 Stress Pounce — pounces on your stress so you don\'t have to',
      '😴 Power-Nap Coach — perfect 20-minute recharges',
      '🔍 Curiosity Boost — turns boring study into exploring',
      '💜 Purr Engine — purrs at exactly the focus frequency',
      '🚪 Confident Strut — walk into any room like you own it']},
    4:{name:'Dog', price:16, powers:[
      '🎾 Fact Fetcher — fetches the answer you almost remembered',
      '🏃 Walk Buddy — gets you outside and moving every day',
      '🛡️ Mood Guard — barks bad moods right out of the room',
      '🤝 Friend Magnet — makes making friends easier',
      '👂 Best Listener — hears every worry, judges none']},
    5:{name:'Budgie', price:18, powers:[
      '🗣️ Vocab Parrot — repeats your spelling words till they stick',
      '🎵 Happy Whistle — whistles your favourite song when you\'re down',
      '🎤 Speech Coach — practise presentations to a kind audience',
      '🌈 Colour Splash — brightens the most boring afternoon',
      '🪽 Big-Picture View — flies up high so you see what matters']},
    6:{name:'Triceratops', price:20, powers:[
      '🛡️ Triple Shield — blocks three worries at once',
      '🪨 Homework Crusher — stomps big tasks into little pieces',
      '💪 Brave Horns — lends courage for tests and try-outs',
      '🥦 Veggie Power — cheers you on to eat the green stuff',
      '⛰️ Unshakeable — stands steady when everything wobbles']}
  };
  function petImg(t, happy){
    t = parseInt(t, 10) || 1;
    return 'assets/pets/p' + t + (happy ? '-h' : '') + '.jpg';
  }
  function petCallName(pet){ return pet.name || ('your ' + PETS[pet.type].name); }

  function renderPet(){
    var box = $('petBox');
    if(!me.pet){
      box.innerHTML = '<div class="prof-empty">No pet yet — pets eat your spare snacks and learn a superpower every 10 ❤️!</div>'
        + '<button class="prof-btn" id="shopOpenBtn">🐾 Visit the Pet Shop</button>';
      return;
    }
    var pet = me.pet, meta = PETS[pet.type] || PETS[1];
    box.innerHTML =
      '<div class="pet-card">'
      + '<div class="pet-love">❤️ ' + (parseInt(pet.affection, 10) || 0) + '</div>'
      + '<div class="pet-name">'
      +   (pet.name ? esc(pet.name) : '<span style="color:#8aa19c">Name me!</span>')
      +   ' <button id="petNameBtn" title="Name your pet">✏️</button></div>'
      + '<div class="pet-stage' + (Date.now() < fedUntil ? ' fed' : '') + '" id="petStage">'
      +   '<img src="' + petImg(pet.type, false) + '" alt="' + esc(meta.name) + '">'
      +   '<img class="happy" src="' + petImg(pet.type, true) + '" alt="">'
      + '</div>'
      + ((pet.powers && pet.powers.length)
          ? '<div class="pet-powers">' + pet.powers.map(function(pw){
              return '<span>' + esc(pw.split(' — ')[0]) + '</span>';
            }).join('') + '</div>' : '')
      + '<div class="pet-hint">Feed snacks from My stuff — every 10 ❤️ unlocks a superpower!</div>'
      + '</div>';
  }
  $('petBox').addEventListener('click', function(e){
    if(e.target.closest('#shopOpenBtn')){ renderShop(); showView('shop'); return; }
    if(e.target.closest('#petNameBtn')){ namePet(); return; }
  });

  function namePet(){
    var meta = PETS[me.pet.type];
    var name = window.prompt('What will you name your ' + meta.name + '?', me.pet.name || '');
    if(name === null) return;
    name = String(name).trim().slice(0, 16);
    if(!name){ toast('A pet needs a name!'); return; }
    var pet = Object.assign({}, me.pet, {name: name});
    store.update(me.id, {pet: pet}).then(function(){
      toast('✨ ' + name + ' loves it!');
      refresh();
    }).catch(function(){ toast('Hmm, that didn\'t save — try again!'); });
  }

  function renderShop(){
    $('petGrid').innerHTML = Object.keys(PETS).map(function(t){
      var m = PETS[t];
      return '<button data-t="' + t + '"><img src="assets/pets/s' + t + '.jpg" alt="mystery pet">'
        + '<div class="pn">' + m.name + '</div><div class="pp">' + m.price + ' W</div></button>';
    }).join('');
  }
  var buying = false;
  $('petGrid').addEventListener('click', function(e){
    var b = e.target.closest('button[data-t]'); if(!b || buying) return;
    var t = parseInt(b.dataset.t, 10), meta = PETS[t];
    if(me.pet){ toast('You already have a pet — one each!'); return; }
    if((me.money || 0) < meta.price){
      toast('Save up! The ' + meta.name + ' costs ' + meta.price + ' Whare — you have ' + (me.money || 0) + '.');
      return;
    }
    if(!window.confirm('Buy the ' + meta.name + ' for ' + meta.price + ' Whare?')) return;
    buying = true;
    store.update(me.id, {
      money: (me.money || 0) - meta.price,
      pet: {type: t, name: null, affection: 0, powers: []}
    }).then(function(){
      toast('🎉 Your ' + meta.name + ' is home — give it a name!');
      showView('main');
      return refresh();          // hold the latch until `me` is fresh —
    }).then(function(){          // no sneaky second purchase in the gap
      buying = false;
    }).catch(function(){ buying = false; toast('Hmm, that didn\'t save — try again!'); });
  });

  var fedUntil = 0;
  function feedPet(idx, itemKey, fromBtn){
    if(stuffBusy) return;
    stuffBusy = true;
    var p = G.PRODUCTS[itemKey];
    var pet = me.pet, meta = PETS[pet.type];
    var items = me.items.slice(); items.splice(idx, 1);
    var newPet = Object.assign({}, pet, {affection: (pet.affection || 0) + 5});
    store.update(me.id, {items: items, pet: newPet}).then(function(){
      /* the snack flies over to the pet */
      var stage = $('petStage');
      if(fromBtn && stage){
        var a = fromBtn.getBoundingClientRect(), c = stage.getBoundingClientRect();
        if(a.width && c.width){
          var g = document.createElement('div');
          g.className = 'snack-fly sprite';
          g.style.cssText += ';background-position:' + (p.col * 25) + '% ' + (p.row * 100 / 3) + '%';
          g.style.left = (a.left + a.width/2 - 28) + 'px';
          g.style.top = (a.top + a.height/2 - 28) + 'px';
          document.body.appendChild(g);
          try{
            g.animate([
              {transform: 'translate(0,0) scale(1)', opacity: 1},
              {transform: 'translate(' + ((c.left + c.width/2) - (a.left + a.width/2)) + 'px,'
                        + ((c.top + c.height/2) - (a.top + a.height/2)) + 'px) scale(.3)', opacity: .2}
            ], {duration: 700, easing: 'ease-in'}).onfinish = function(){ if(g.parentNode) g.remove(); };
          }catch(err){}
          setTimeout(function(){ if(g.parentNode) g.remove(); }, 900);
        }
      }
      toast('😋 ' + petCallName(pet) + ' loved the ' + p.name + '! +5 ❤️');
      return refresh();
    }).then(function(){
      /* soft happy crossfade, then back to normal — fedUntil lets renderPet
         re-apply the class if a realtime refresh rebuilds the stage mid-glow */
      fedUntil = Date.now() + 2400;
      var stage = $('petStage');
      if(stage) stage.classList.add('fed');
      setTimeout(function(){
        fedUntil = 0;
        var s2 = $('petStage');
        if(s2) s2.classList.remove('fed');
      }, 2400);
      stuffBusy = false;
      maybeOfferPower();
    }).catch(function(){
      stuffBusy = false;
      toast('Hmm, the snack got lost — try again!');
    });
  }

  function maybeOfferPower(){
    var pet = me && me.pet;
    if(!pet) return;
    var earned = Math.floor((pet.affection || 0) / 10);
    if(earned <= (pet.powers || []).length) return;
    var meta = PETS[pet.type];
    var remaining = meta.powers.filter(function(pw){ return (pet.powers || []).indexOf(pw) === -1; });
    if(!remaining.length) return;
    $('powerTitle').textContent = '🌟 ' + petCallName(pet) + ' can learn a superpower!';
    $('powerList').innerHTML = remaining.map(function(pw, i){
      return '<button data-pw="' + i + '">' + esc(pw) + '</button>';
    }).join('');
    $('powerList').dataset.opts = JSON.stringify(remaining);
    $('powerWrap').classList.add('open');
  }
  $('powerList').addEventListener('click', function(e){
    var b = e.target.closest('button[data-pw]'); if(!b || !me.pet) return;
    var opts = JSON.parse($('powerList').dataset.opts || '[]');
    var pw = opts[parseInt(b.dataset.pw, 10)];
    if(!pw) return;
    if((me.pet.powers || []).indexOf(pw) !== -1){    // chosen in another tab meanwhile
      $('powerWrap').classList.remove('open');
      refresh();
      return;
    }
    var pet = Object.assign({}, me.pet, {powers: (me.pet.powers || []).concat([pw])});
    store.update(me.id, {pet: pet}).then(function(){
      $('powerWrap').classList.remove('open');       // close only once it's saved
      toast('🌟 New superpower learned!');
      return refresh().then(maybeOfferPower).catch(function(){});
    }).catch(function(){ toast('Hmm, that didn\'t save — tap it again!'); });
  });

  /* ------------- my rule attempts (side panel history) -------------
     Right answers sparkle for 3 s. A wrong try only reveals the real rule
     once that game is over — no cheating by peeking mid-game! */
  function renderAttempts(){
    var atts = (me.guesses || []).slice().reverse().slice(0, 12);
    if(!atts.length){
      $('attemptsBox').innerHTML = '<div class="prof-empty">Every rule you try to crack in the Algebra Machine lands here. 🕵️</div>';
      return;
    }
    $('attemptsBox').innerHTML = atts.map(function(a){
      var pretty = function(s){ return esc(String(s)).replace(/x/g,'𝑥'); };
      var live = a.mid && machineState[a.mid] && machineState[a.mid] !== 'done';
      var ruleLine = a.ok
        ? '✨ Rule: <span class="rule">𝑥 → ' + pretty(a.rule) + '</span> ✨'
        : (live ? 'Rule: 🤫 still playing — no peeking!'
                : 'Rule was: <span class="rule">𝑥 → ' + pretty(a.rule) + '</span>');
      return '<div class="att' + (a.ok ? ' win' : '') + '">'
        + (a.ok ? '✅' : '❌') + ' <span class="try">I tried: ' + pretty(a.guess || '?') + '</span><br>'
        + ruleLine + '</div>';
    }).join('');
  }
  function refresh(){
    if(!sess) return Promise.resolve();
    return store.listMachines().then(function(ms){
      machineState = {};
      ms.forEach(function(m){ machineState[m.id] = m.state; });
    }).catch(function(){}).then(function(){
      return store.list();
    }).then(function(list){
      me = list.filter(function(s){ return s.id === sess.id; })[0] || null;
      if(!me){ window.location.replace('index.html'); return; }
      render();
    });
  }

  /* ---------------- profile drawer ---------------- */
  function openProf(){
    $('profWrap').classList.add('open');
    showPicker(false);
    maybeOfferPower();     // an earned-but-unchosen superpower greets you here
  }
  function closeProf(){ $('profWrap').classList.remove('open'); }
  $('meBtn').addEventListener('click', openProf);
  $('profClose').addEventListener('click', closeProf);
  $('profWrap').addEventListener('click', function(e){ if(e.target === $('profWrap')) closeProf(); });

  /* the profile popup has three faces: the room, the emoji picker, the shop */
  function showView(which){
    $('profMain').style.display = which === 'main' ? '' : 'none';
    $('profPicker').style.display = which === 'picker' ? '' : 'none';
    $('profShop').style.display = which === 'shop' ? '' : 'none';
  }
  function showPicker(on){ showView(on ? 'picker' : 'main'); }
  $('shopBack').addEventListener('click', function(){ showView('main'); });
  $('editEmojiBtn').addEventListener('click', function(){
    window.CharlieEmoji.mount($('profPickerBox'), {
      initial: me && me.emoji,
      saveLabel: 'Save my emoji',
      onSave: function(emoji){
        store.update(me.id, {emoji:emoji}).then(function(){
          me.emoji = emoji;
          try{
            sess.emoji = emoji;
            sessionStorage.setItem('charlie-session', JSON.stringify(sess));
          }catch(e){}
          render();
          showPicker(false);
          toast('✨ Looking good!');
        });
      }
    });
    showPicker(true);
  });
  $('pickerBack').addEventListener('click', function(){ showPicker(false); });

  $('logoutBtn').addEventListener('click', function(){
    try{ sessionStorage.removeItem('charlie-session'); }catch(e){}
    window.location.href = 'index.html';
  });

  /* ---------------- games ---------------- */
  $('alzebraGame').addEventListener('click', function(){
    window.location.href = 'alzebra.html';
  });
  $('algebraGame').addEventListener('click', function(){
    window.location.href = 'algebra.html';
  });

  /* ---------------- init ---------------- */
  store.init().then(function(){
    store.onChange(refresh);     // money won in games appears live
    return refresh();
  }).then(function(){
    /* game pages link here as hub.html#me to open My room straight away;
       drop the hash so a later reload doesn't reopen it */
    if(window.location.hash === '#me'){
      openProf();
      try{ history.replaceState(null, '', window.location.pathname + window.location.search); }catch(e){}
    }
  });
})();
</script>
</body>
</html>
